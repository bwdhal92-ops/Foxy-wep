<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Foxy Voice Overlay</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  user-select: none;
  -webkit-user-select: none;
}
/* ── Overlay Container (covers the full game window) ── */
#floating-voice-overlay {
  position: fixed;
  inset: 0;
  z-index: 99999;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s ease;
}
#floating-voice-overlay.fvo-visible { opacity: 1; }
#floating-voice-overlay.fvo-hidden  { opacity: 0; pointer-events: none; }

/* ── Voice Panel (the actual visible box) ── */
#fvo-voice-panel {
  position: absolute;
  width: 220px;
  max-height: 340px;
  background: rgba(13,14,19,0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 16px;
  overflow: hidden;
}

/* ── Position Presets (position the panel inside the game window) ── */
.fvo-pos-top-left    { top: 20px;  left: 20px;  bottom: auto; right: auto; }
.fvo-pos-top-right   { top: 20px;  left: auto;  bottom: auto; right: 20px; }
.fvo-pos-bottom-left { top: auto;  left: 24px;  bottom: 24px; right: auto; }
.fvo-pos-bottom-right{ top: auto;  left: auto;  bottom: 24px; right: 24px; }
/* ── Header ── */
#fvo-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  background: rgba(255,255,255,0.03);
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
#fvo-header-left {
  display: flex;
  align-items: center;
  gap: 6px;
}
#fvo-mic-icon {
  width: 14px; height: 14px;
  color: #22c55e;
  flex-shrink: 0;
}
#fvo-title {
  font-size: 12px;
  font-weight: 700;
  color: #e5e7eb;
  letter-spacing: 0.3px;
}
#fvo-header-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
#fvo-count {
  font-size: 11px;
  font-weight: 700;
  color: #9ca3af;
  background: rgba(255,255,255,0.06);
  border-radius: 10px;
  padding: 0 7px;
  line-height: 18px;
  min-width: 20px;
  text-align: center;
}
/* ── Body ── */
#fvo-body {
  max-height: 280px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 6px 8px;
}
#fvo-body::-webkit-scrollbar { width: 3px; }
#fvo-body::-webkit-scrollbar-track { background: transparent; }
#fvo-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
#fvo-empty {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px 12px;
  font-size: 11px;
  font-weight: 500;
  color: #6b7280;
}
/* ── Member Row ── */
.fvo-member-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 6px;
  border-radius: 8px;
  margin-bottom: 2px;
  transition: background 0.15s;
}
.fvo-avatar-wrap {
  width: 28px; height: 28px;
  border-radius: 50%;
  overflow: hidden;
  flex-shrink: 0;
  border: 2px solid transparent;
  transition: border-color 0.15s, box-shadow 0.15s;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #3b82f6;
}
.fvo-avatar-img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
}
.fvo-avatar-init {
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  line-height: 1;
}
.fvo-name {
  font-size: 12px;
  font-weight: 600;
  color: #d1d5db;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.fvo-local .fvo-name { color: #60a5fa; }
/* Speaking glow */
.fvo-member-row.fvo-speaking .fvo-avatar-wrap {
  border-color: #22c55e;
  box-shadow: 0 0 12px rgba(34,197,94,0.45), 0 0 4px rgba(34,197,94,0.3);
}
.fvo-member-row.fvo-speaking .fvo-name {
  color: #fff;
}
</style>
</head>
<body>
<div id="floating-voice-overlay" class="fvo-hidden">
  <div id="fvo-voice-panel" class="fvo-pos-bottom-left">
    <div id="fvo-header">
      <div id="fvo-header-left">
        <svg id="fvo-mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="11" rx="3" ry="3"/><path d="M5 10v2a7 7 0 0014 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
        <span id="fvo-title">Voice</span>
      </div>
      <div id="fvo-header-right">
        <span id="fvo-count">0</span>
      </div>
    </div>
    <div id="fvo-body">
      <div id="fvo-member-list"></div>
      <div id="fvo-empty">No one in voice</div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const overlay = document.getElementById('floating-voice-overlay');
  const panel = document.getElementById('fvo-voice-panel');
  const memberList = document.getElementById('fvo-member-list');
  const emptyEl = document.getElementById('fvo-empty');
  const countEl = document.getElementById('fvo-count');
  const memberEntries = {};
  const speakingTimers = {};
  const CONFIG = { speakingHoldMs: 300 };
  let currentPosition = 'bottom-left';

  window.__overlayControl = {
    show: function () {
      overlay.classList.remove('fvo-hidden');
      overlay.classList.add('fvo-visible');
    },
    hide: function () {
      overlay.classList.remove('fvo-visible');
      overlay.classList.add('fvo-hidden');
    },
    setPosition: function (pos) {
      var p = pos || 'bottom-left';
      if (panel) {
        panel.classList.remove('fvo-pos-top-left','fvo-pos-top-right','fvo-pos-bottom-left','fvo-pos-bottom-right');
        panel.classList.add('fvo-pos-' + p.replace(/-/g,'-'));
      }
      currentPosition = p;
    },
    updateMembers: function (members) {
      if (!members || !Array.isArray(members)) members = [];
      emptyEl.style.display = members.length === 0 ? 'flex' : 'none';
      countEl.textContent = members.length;

      var currentIds = {};
      members.forEach(function (m) {
        currentIds[m.id] = true;
        var existing = memberEntries[m.id];
        if (existing) {
          existing.nameEl.textContent = m.name;
          if (m.avatar) {
            existing.imgEl.src = m.avatar;
            existing.imgEl.style.display = '';
            existing.initEl.style.display = 'none';
          } else {
            existing.imgEl.style.display = 'none';
            existing.initEl.style.display = '';
            existing.initEl.textContent = (m.name || '?')[0].toUpperCase();
          }
          existing.rowEl.classList.toggle('fvo-local', !!m.isLocal);
        } else {
          addMemberEntry(m);
        }
      });
      for (var id in memberEntries) {
        if (!currentIds[id]) removeMemberEntry(id);
      }
    },
    updateSpeaking: function (speakingIds) {
      var ids = speakingIds || [];
      var set = {};
      ids.forEach(function (id) { set[id] = true; });
      for (var id in memberEntries) {
        var entry = memberEntries[id];
        var isSp = !!set[id];
        if (isSp) {
          entry.rowEl.classList.add('fvo-speaking');
          if (speakingTimers[id]) { clearTimeout(speakingTimers[id]); delete speakingTimers[id]; }
        } else if (!speakingTimers[id]) {
          speakingTimers[id] = setTimeout(function () {
            entry.rowEl.classList.remove('fvo-speaking');
            delete speakingTimers[id];
          }, CONFIG.speakingHoldMs);
        }
      }
    }
  };

  function addMemberEntry(m) {
    var row = document.createElement('div');
    row.className = 'fvo-member-row';
    row.dataset.id = m.id;
    var wrap = document.createElement('div');
    wrap.className = 'fvo-avatar-wrap';
    var img = document.createElement('img');
    img.className = 'fvo-avatar-img';
    img.src = m.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect fill=%22%233b82f6%22 width=%22100%22 height=%22100%22/%3E%3Ctext x=%2250%22 y=%2256%22 text-anchor=%22middle%22 fill=%22white%22 font-size=%2240%22 font-weight=%22bold%22 font-family=%22sans-serif%22%3E%3F%3C/text%3E%3C/svg%3E';
    img.alt = '';
    var init = document.createElement('span');
    init.className = 'fvo-avatar-init';
    init.textContent = (m.name || '?')[0].toUpperCase();
    if (m.avatar) init.style.display = 'none';
    img.onerror = function () { img.style.display = 'none'; init.style.display = ''; };
    wrap.appendChild(img);
    wrap.appendChild(init);
    var nameEl = document.createElement('span');
    nameEl.className = 'fvo-name';
    nameEl.textContent = m.name;
    row.appendChild(wrap);
    row.appendChild(nameEl);
    if (m.isLocal) row.classList.add('fvo-local');
    memberList.appendChild(row);
    memberEntries[m.id] = { rowEl: row, imgEl: img, initEl: init, nameEl: nameEl };
  }

  function removeMemberEntry(id) {
    var entry = memberEntries[id];
    if (entry) {
      if (entry.rowEl && entry.rowEl.parentNode) entry.rowEl.parentNode.removeChild(entry.rowEl);
      delete memberEntries[id];
    }
    if (speakingTimers[id]) { clearTimeout(speakingTimers[id]); delete speakingTimers[id]; }
  }
})();
</script>
</body>
</html>
