<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="electron.offline_title">Foxy — لا يوجد اتصال بالإنترنت</title>
<style>
  :root {
    --bg: #02040b;
    --bg2: #060914;
    --cyan: #00eeff;
    --pink: #ff1f72;
    --purple: #8b3cff;
    --green: #00ffb2;
    --text: #e4f0ff;
    --muted: rgba(164, 210, 255, 0.55);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }
  /* شبكة خلفية خافتة — نفس هوية الموقع */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 238, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 238, 255, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }
  /* توهجات ملونة */
  .glow { position: fixed; border-radius: 50%; filter: blur(120px); opacity: .18; pointer-events: none; }
  .glow.cyan { width: 420px; height: 420px; background: var(--cyan); top: -120px; right: -120px; }
  .glow.purple { width: 380px; height: 380px; background: var(--purple); bottom: -120px; left: -120px; }
  .card {
    position: relative;
    max-width: 460px;
    width: 100%;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 24px;
    padding: 3rem 2.5rem;
    backdrop-filter: blur(12px);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
  }
  .logo {
    width: 84px;
    height: 84px;
    border-radius: 22px;
    margin: 0 auto 1.4rem;
    box-shadow: 0 0 40px rgba(0, 238, 255, 0.35);
  }
  .status-dot {
    display: inline-flex;
    align-items: center;
    gap: .5rem;
    font-size: .85rem;
    color: var(--muted);
    background: rgba(255, 31, 114, 0.08);
    border: 1px solid rgba(255, 31, 114, 0.3);
    padding: .35rem 1rem;
    border-radius: 999px;
    margin-bottom: 1.2rem;
  }
  .status-dot::before {
    content: '';
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--pink);
    animation: blink 1.4s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: .25; } }
  h1 {
    font-size: 1.6rem;
    font-weight: 900;
    margin-bottom: .6rem;
    background: linear-gradient(90deg, var(--cyan), var(--purple));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p { color: var(--muted); line-height: 1.9; margin-bottom: 1.8rem; }
  .btn {
    display: inline-block;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    color: #02141a;
    background: linear-gradient(90deg, var(--cyan), var(--green));
    border: none;
    border-radius: 14px;
    padding: .9rem 2.6rem;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s;
    box-shadow: 0 8px 30px rgba(0, 238, 255, 0.25);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0, 238, 255, 0.4); }
  .btn:disabled { opacity: .6; cursor: wait; transform: none; }
  .hint { margin-top: 1.4rem; font-size: .8rem; color: rgba(164, 210, 255, 0.35); }
  kbd {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 6px;
    padding: .1rem .5rem;
    font-family: inherit;
  }
  /* العرض البرمجي (sw=1): إطفاء الفلاتر الثقيلة التي قد تُرسم سوداء في SwiftShader */
  .no-fx .glow { display: none; }
  .no-fx body::before, body.no-fx::before { display: none; }
  .no-fx .card { backdrop-filter: none; -webkit-backdrop-filter: none; }
  .no-fx .btn:hover { transform: none; }
</style>
<div id="el-lang" style="position:fixed;top:14px;inset-inline-end:14px;z-index:50;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:6px 10px;backdrop-filter:blur(10px)"><span style="font-size:16px">🌐</span><select class="foxy-lang-select" aria-label="Language" style="background:transparent;color:#fff;border:none;font-weight:700;font-size:13px;cursor:pointer;outline:none"></select></div><style>#el-lang select option{color:#111}html[dir="ltr"] body{direction:ltr !important;text-align:left !important}</style><script src="../assets/js/i18n.js"></script></head>
<body>
  <div class="glow cyan"></div>
  <div class="glow purple"></div>

  <div class="card">
    <img class="logo" src="../assets/img/foxy.png" alt="Foxy" onerror="this.style.display='none'">
    <div class="status-dot" data-i18n="electron.offline_badge">غير متصل بالإنترنت</div>
    <h1 data-i18n="electron.offline_h1">انقطع الاتصال يا صديقي 🎙️</h1>
    <p data-i18n="electron.offline_p">تعذّر الوصول إلى خوادم Foxy. تحقق من اتصالك بالإنترنت ثم اضغط إعادة المحاولة — سنعيدك إلى المحادثة فوراً.</p>
    <button class="btn" id="retryBtn" onclick="retryConnection()" data-i18n="electron.offline_retry">🔄 إعادة المحاولة</button>
    <div class="hint" data-i18n="electron.offline_hint">تلميح: يمكنك استخدام <kbd>Ctrl</kbd> + <kbd>Shift</kbd> + <kbd>M</kbd> لكتم الميكروفون في أي وقت</div>
  </div>

<script>
  try { if (new URLSearchParams(location.search).get('sw') === '1') document.body.classList.add('no-fx'); } catch (e) {}
  async function retryConnection() {
    const btn = document.getElementById('retryBtn');
    btn.disabled = true;
    btn.textContent = window.__fb('electron.offline_trying', '⏳ جارٍ المحاولة...');
    try {
      if (window.electronAPI && window.electronAPI.retryConnection) {
        const ok = await window.electronAPI.retryConnection();
        if (!ok) throw new Error('still offline');
      } else {
        window.location.reload();
      }
    } catch {
      btn.disabled = false;
      btn.textContent = window.__fb('electron.offline_retry', '🔄 إعادة المحاولة');
    }
  }

  window.addEventListener('online', () => retryConnection());
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') retryConnection();
  });
</script>
</body>
</html>
